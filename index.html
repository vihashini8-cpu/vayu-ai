<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAYU AI — India's Unified Weather Intelligence Platform</title>
    <meta name="description" content="VAYU AI: One Nation. One Sky. One Intelligence. India's unified national weather intelligence, cross-source verification, and situational awareness platform." />
    <meta property="og:title" content="VAYU AI — India's Unified Weather Intelligence Platform" />
    <meta property="og:description" content="VAYU AI: One Nation. One Sky. One Intelligence. India's unified national weather intelligence platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F3FF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0B1F" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('vayu-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-app text-fg selection:bg-primary/30 selection:text-primary antialiased overflow-x-hidden transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
